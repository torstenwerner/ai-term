<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Book Cover -->
    <rect x="50" y="30" width="100" height="140" fill="#8B4513" stroke="#333" stroke-width="3" rx="5"/>
    <!-- Book Pages -->
    <rect x="55" y="35" width="90" height="130" fill="#f5f5dc" stroke="#333" stroke-width="2"/>
    <!-- Page Lines -->
    <line x1="70" y1="60" x2="130" y2="60" stroke="#666" stroke-width="2"/>
    <line x1="70" y1="80" x2="130" y2="80" stroke="#666" stroke-width="2"/>
    <line x1="70" y1="100" x2="130" y2="100" stroke="#666" stroke-width="2"/>
    <line x1="70" y1="120" x2="130" y2="120" stroke="#666" stroke-width="2"/>
    <line x1="70" y1="140" x2="130" y2="140" stroke="#666" stroke-width="2"/>
    <!-- Book Spine -->
    <rect x="50" y="30" width="15" height="140" fill="#654321" stroke="#333" stroke-width="3" rx="5"/>
    <!-- Letter 'A' on cover -->
    <text x="100" y="110" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#333" text-anchor="middle">A</text>
</svg>
