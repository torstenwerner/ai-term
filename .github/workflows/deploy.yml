name: Deploy to S3 and Cloud Front

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'
      VITE_REST_ENDPOINT: ${{ vars.VITE_REST_ENDPOINT }}
      VITE_REST_API_KEY: ${{ secrets.VITE_REST_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            const token = await core.getIDToken('sts.amazonaws.com');  // same aud as action uses
            console.log("Raw ID token:", token);
            // Decode JWT manually or just log claims
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString());
            console.log("Decoded claims:", JSON.stringify(claims, null, 2));

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ai-term-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Sync the frontend/dist directory to the specified S3 bucket.
      # The --delete flag removes files in the bucket that are not present in frontend/dist.
      - name: Sync files to S3
        run: |
          aws s3 sync ./frontend/dist s3://${{ vars.S3_BUCKET_NAME }}/ai --delete

      # Invalidate CloudFront distribution cache.
      # This ensures users get the latest version of the files.
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
